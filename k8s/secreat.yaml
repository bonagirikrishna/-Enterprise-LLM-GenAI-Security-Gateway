apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: llm-gateway
type: Opaque
stringData:
  GW_GATEWAY_API_KEYS: "prod-key-1,prod-key-2"     # NOT base64 — stringData encodes it
  GW_OPENAI_API_KEY: "sk-..."
  GW_ANTHROPIC_API_KEY: "sk-ant-..."
  GW_DATABASE_URL: "postgresql://gateway:CHANGE_ME@postgres:5432/gateway"
  POSTGRES_PASSWORD: "CHANGE_ME"                  # used by the postgres StatefulSet