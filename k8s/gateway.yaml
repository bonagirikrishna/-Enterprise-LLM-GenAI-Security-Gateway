apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-security-gateway
  namespace: ai-security
spec:
  replicas: 2
  selector:
    matchLabels: {app: ai-security-gateway}
  template:
    metadata:
      labels: {app: ai-security-gateway}
    spec:
      containers:
        - name: gateway
          image: your-registry/ai-security-gateway:1.0.0
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: gateway-config}
            - secretRef: {name: gateway-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-security-gateway
  namespace: ai-security
spec:
  selector: {app: ai-security-gateway}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-security-gateway
  namespace: ai-security
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ai-security-gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}

